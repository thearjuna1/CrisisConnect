<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrisisConnect — Report. Verify. Resolve.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a href="#/" class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            CrisisConnect
        </a>
        <nav class="nav" id="nav"></nav>
        <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
    </div>
</header>

<main id="app"></main>

<footer class="emergency-strip">
    <div class="emergency-inner">
        <div class="emergency-label">Emergency contacts</div>
        <div class="emergency-grid" id="emergencyGrid">
            <div class="emergency-skeleton">Loading…</div>
        </div>
    </div>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
